name: CI/CD Chiller Optimizer

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and Run Tests
        run: |
          pip install -r requirements.txt
          pytest tests/

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: acrchilleroptimizertourki.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build \
            -t acrchilleroptimizertourki.azurecr.io/chiller-app:${{ github.sha }} \
            -t acrchilleroptimizertourki.azurecr.io/chiller-app:latest \
            .
          docker push acrchilleroptimizertourki.azurecr.io/chiller-app:${{ github.sha }}
          docker push acrchilleroptimizertourki.azurecr.io/chiller-app:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chiller-optimizer-tourki'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'acrchilleroptimizertourki.azurecr.io/chiller-app:latest'
